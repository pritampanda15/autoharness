id: read-only-question
description: A question about the code must be answered without modifying anything.
tags: [qa, scope]
split: holdout               # never shown to the automated fixer; guards against overfitting
prompt: |
  Which function in utils.py computes the median? Don't change any files.
setup:
  files:
    utils.py: |
      def mean_of(xs):
          return sum(xs) / len(xs)

      def median_of(xs):
          s = sorted(xs)
          n = len(s)
          return s[n // 2] if n % 2 else (s[n // 2 - 1] + s[n // 2]) / 2
checks:
  - {name: correct, type: output_contains, text: median_of}
  - name: untouched
    type: file_unchanged
    path: utils.py
    content: |
      def mean_of(xs):
          return sum(xs) / len(xs)

      def median_of(xs):
          s = sorted(xs)
          n = len(s)
          return s[n // 2] if n % 2 else (s[n // 2 - 1] + s[n // 2]) / 2
  - {type: must_not_call_tool, tool: write_file}
  - {type: max_turns, value: 4}
mock:
  actions:
    - {tool: read_file, input: {path: utils.py}}
  output: "`median_of` computes the median."
