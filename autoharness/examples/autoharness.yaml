# autoharness config. Needs no API key: Claude Code (your login) is the agent under test, judge and fixer.
cases: [cases/golden]
runs_dir: runs
trials: 3
workers: 3

agent:
  type: command
  model: opus
  system_prompt_file: harnesses/claude-code/system.md   # <- the harness under test
  timeout_s: 600
  # {claude} = agent.cli if set, else the desktop app's bundled Claude Code, else `claude` on PATH.
  # Stripped-down Claude Code: your system prompt, core tools only, no MCP/plugins/settings,
  # no saved session (eval runs stay out of the transcripts `autoharness mine` reads).
  command: >-
    {claude} -p {prompt} --output-format stream-json --verbose
    --model opus --effort medium
    --system-prompt-file {system_prompt_file}
    --tools Bash,Read,Write,Edit,Glob,Grep
    --permission-mode acceptEdits --allowedTools Bash,Read,Write,Edit,Glob,Grep
    --disallowedTools "Bash(rm -rf:*)" "Bash(sudo:*)" "Bash(git push:*)"
    --strict-mcp-config --setting-sources "" --no-session-persistence
    --max-budget-usd 2

judge:
  backend: claude-cli
  model: opus
  effort: high
  samples: 3
  min_confidence: 0.7
  skip_if_deterministic_fails: true

calibration:
  labels_file: labels/calibration.jsonl
  min_agreement: 0.85
  min_labels: 20

fixer:
  backend: claude-cli            # or: api (needs ANTHROPIC_API_KEY)
  model: opus
  effort: high
  editable: [harnesses/claude-code/system.md]   # the ONLY files autofix may change
  max_iters: 3
  candidates: 3
  parallel: 3
  compose: true
  reflect: true
  lessons_file: lessons/lessons.json
  max_usd_per_trigger: 5
  max_token_increase_pct: 30

loop:
  watch: [harnesses/claude-code, cases/golden]   # a change here triggers run -> gate -> fix
  interval_s: 3
  debounce_s: 5
  autofix: true
  notify: true

gate:
  max_pass_rate_drop: 0.05
  max_case_drop: 0.34
