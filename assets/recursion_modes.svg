<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 250" width="100%" role="img" aria-label="Parallel vs Sequential Task-Level Recursion Modes">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
    .hdr  { font-size: 13px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
    .box  { font-size: 13px; font-weight: 600; fill: #0f172a; }
    .sub  { font-size: 11.5px; fill: #475569; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="250" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Left Panel: Parallel Exploration + Contrastive Compose -->
  <rect x="20" y="20" width="510" height="210" rx="12" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="38" y="46" class="sans hdr" fill="#1967d2">Parallel Exploration (`candidates: K`, `compose: true`)</text>

  <rect x="38" y="106" width="88" height="44" rx="8" fill="#e8f0fe" stroke="#4285F4"/>
  <text x="82" y="133" text-anchor="middle" class="sans box">Base h₀</text>

  <line x1="126" y1="120" x2="174" y2="78" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="126" y1="128" x2="174" y2="128" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="126" y1="136" x2="174" y2="178" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>

  <rect x="178" y="60" width="136" height="36" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="246" y="83" text-anchor="middle" class="sans sub">Probe h₁ (Invariant)</text>
  <rect x="178" y="110" width="136" height="36" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="246" y="133" text-anchor="middle" class="sans sub">Probe h₂ (Skill)</text>
  <rect x="178" y="160" width="136" height="36" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="246" y="183" text-anchor="middle" class="sans sub">Probe h₃ (Guardrail)</text>

  <line x1="314" y1="78" x2="366" y2="120" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="314" y1="128" x2="366" y2="128" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="314" y1="178" x2="366" y2="136" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>

  <rect x="370" y="96" width="142" height="64" rx="8" fill="#dcfce7" stroke="#34A853" stroke-width="1.5"/>
  <text x="441" y="124" text-anchor="middle" class="sans box" fill="#15803d">Compose h*</text>
  <text x="441" y="144" text-anchor="middle" class="sans sub" fill="#166534">+ Holdout Gate</text>

  <!-- Right Panel: Sequential Iterative Refinement -->
  <rect x="550" y="20" width="510" height="210" rx="12" fill="#f8fafc" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="568" y="46" class="sans hdr" fill="#b45309">Sequential Refinement (`max_iters: N` + Session History)</text>

  <rect x="570" y="102" width="90" height="52" rx="8" fill="#e8f0fe" stroke="#4285F4"/>
  <text x="615" y="133" text-anchor="middle" class="sans box">Base h₀</text>

  <line x1="660" y1="128" x2="692" y2="128" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>

  <rect x="696" y="102" width="106" height="52" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="749" y="125" text-anchor="middle" class="sans box">Step 1 → h⁽¹⁾</text>
  <text x="749" y="143" text-anchor="middle" class="sans sub">+ evidence</text>

  <line x1="802" y1="128" x2="834" y2="128" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>

  <rect x="838" y="102" width="106" height="52" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="891" y="125" text-anchor="middle" class="sans box">Step 2 → h⁽²⁾</text>
  <text x="891" y="143" text-anchor="middle" class="sans sub">+ evidence</text>

  <line x1="944" y1="128" x2="968" y2="128" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>

  <rect x="972" y="102" width="72" height="52" rx="8" fill="#dcfce7" stroke="#34A853" stroke-width="1.5"/>
  <text x="1008" y="133" text-anchor="middle" class="sans box" fill="#15803d">h⁽ᴺ⁾</text>

  <text x="805" y="192" text-anchor="middle" class="sans sub">Carries forward accepted edits &amp; rejected-attempt history until 100% of dev + holdout checks pass.</text>
</svg>
