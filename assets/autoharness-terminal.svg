<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="680" role="img" aria-label="AutoHarness CLI walkthrough: install, scaffold 8-component Harness², and run the continuous self-healing loop">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; }
    .dim { fill: #94a3b8; }
    .cmd { fill: #f8fafc; font-weight: 600; }
    .ok  { fill: #4ade80; font-weight: 600; }
    .rej { fill: #f87171; }
    .inf { fill: #60a5fa; }
    .wrn { fill: #fbbf24; }
    @keyframes pulse { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .cursor { animation: pulse 1.1s infinite; }
  </style>
  <rect x="0" y="0" width="760" height="330" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <!-- Window chrome -->
  <rect x="0" y="0" width="760" height="36" rx="14" fill="#1e293b"/>
  <rect x="0" y="20" width="760" height="16" fill="#1e293b"/>
  <circle cx="20" cy="18" r="6" fill="#ef4444"/>
  <circle cx="40" cy="18" r="6" fill="#f59e0b"/>
  <circle cx="60" cy="18" r="6" fill="#22c55e"/>
  <text x="380" y="22" text-anchor="middle" class="mono dim" font-size="12">autoharness — autonomous code &amp; Harness² loop</text>

  <!-- Terminal lines -->
  <text x="22" y="64" class="mono"><tspan class="inf">$</tspan> <tspan class="cmd">pip install -e '.[dev]' &amp;&amp; autoharness demo</tspan></text>
  <text x="22" y="90" class="mono dim">1) autonomous code self-healing on src/pricing.py (isolated sandbox, protected tests)</text>
  <text x="22" y="110" class="mono"><tspan class="ok">   ✓ HEALED src/pricing.py</tspan> <tspan class="dim">(AST valid · imports clean · pytest passed · tests untouched)</tspan></text>

  <text x="22" y="138" class="mono dim">2) Harness² Propose → Probe → Compose → Holdout Gate (3 parallel candidates)</text>
  <text x="22" y="158" class="mono"><tspan class="rej">   ✗ candidate 1 (expected answer leak):</tspan> <tspan class="dim">blocked statically — leaked ['8443']</tspan></text>
  <text x="22" y="178" class="mono"><tspan class="rej">   ✗ candidate 2 (rigid rule):</tspan> <tspan class="dim">rejected — hidden holdout dropped 100% → 0%</tspan></text>
  <text x="22" y="198" class="mono"><tspan class="ok">   ✓ candidate 3 (invariant brevity rule):</tspan> <tspan class="dim">dev 80% → 100% · holdout 100% → 100% · KEPT</tspan></text>
  <text x="22" y="218" class="mono"><tspan class="wrn">   ★ lessons updated:</tspan> <tspan class="dim">4 DO/AVOID priors written to lessons/LESSONS.md · review queue: 0</tspan></text>

  <text x="22" y="250" class="mono"><tspan class="inf">$</tspan> <tspan class="cmd">autoharness watch --now</tspan></text>
  <text x="22" y="272" class="mono dim">[watch] monitoring code_paths + harnesses/harness2 (8 components) + cases/golden</text>
  <text x="22" y="292" class="mono"><tspan class="ok">[watch] all checks green — waiting for next code or harness save</tspan></text>
  <rect x="518" y="280" width="8" height="15" fill="#60a5fa" class="cursor"/>
</svg>
