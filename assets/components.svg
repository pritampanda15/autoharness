<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 340" width="100%" role="img" aria-label="Eight editable Harness² components grouped across Context Construction, Tool Interface, Work Delegation, and Middleware Control">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
    .grp  { font-size: 13px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
    .cmp  { font-size: 15px; font-weight: 700; fill: #0f172a; }
    .fil  { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #1a73e8; }
    .dsc  { font-size: 12px; fill: #475569; }
  </style>

  <rect x="0" y="0" width="1080" height="340" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Group 1: Context Construction (4 components) -->
  <rect x="20" y="20" width="510" height="300" rx="14" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.8"/>
  <rect x="20" y="20" width="510" height="36" rx="12" fill="#e8f0fe"/>
  <text x="275" y="43" text-anchor="middle" class="sans grp" fill="#1967d2">Context Construction Space</text>

  <!-- system.md -->
  <rect x="38" y="72" width="228" height="106" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="52" y="96" class="sans cmp">1. System Prompt</text>
  <text x="52" y="114" class="fil">system.md</text>
  <text x="52" y="138" class="sans dsc">Core identity, reasoning loop,</text>
  <text x="52" y="155" class="sans dsc">and output response contract.</text>

  <!-- guardrails.md -->
  <rect x="284" y="72" width="228" height="106" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="298" y="96" class="sans cmp">2. Guardrails</text>
  <text x="298" y="114" class="fil">guardrails.md</text>
  <text x="298" y="138" class="sans dsc">Hard safety boundaries, scope</text>
  <text x="298" y="155" class="sans dsc">limits &amp; non-destructive rules.</text>

  <!-- memory.md -->
  <rect x="38" y="194" width="228" height="106" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="52" y="218" class="sans cmp">3. Working Memory</text>
  <text x="52" y="236" class="fil">memory.md</text>
  <text x="52" y="260" class="sans dsc">Auto-synced codebase map &amp;</text>
  <text x="52" y="277" class="sans dsc">multi-turn state schema.</text>

  <!-- skills.md -->
  <rect x="284" y="194" width="228" height="106" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="298" y="218" class="sans cmp">4. Procedural Skills</text>
  <text x="298" y="236" class="fil">skills.md</text>
  <text x="298" y="260" class="sans dsc">Reusable playbooks: bugfixing,</text>
  <text x="298" y="277" class="sans dsc">refactoring &amp; concise Q&amp;A.</text>

  <!-- Group 2: Tool Interface (2 components) -->
  <rect x="550" y="20" width="250" height="300" rx="14" fill="#f8fafc" stroke="#86efac" stroke-width="1.8"/>
  <rect x="550" y="20" width="250" height="36" rx="12" fill="#e6f4ea"/>
  <text x="675" y="43" text-anchor="middle" class="sans grp" fill="#137333">Tool Interface</text>

  <!-- tool_guidance.md -->
  <rect x="566" y="72" width="218" height="106" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="580" y="96" class="sans cmp">5. Tool Guidance</text>
  <text x="580" y="114" class="fil" fill="#15803d">tool_guidance.md</text>
  <text x="580" y="138" class="sans dsc">Read-before-edit discipline</text>
  <text x="580" y="155" class="sans dsc">&amp; verification ordering.</text>

  <!-- scripts -->
  <rect x="566" y="194" width="218" height="106" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="580" y="218" class="sans cmp">6. Helper Scripts</text>
  <text x="580" y="236" class="fil" fill="#15803d">scripts/* + scripts.md</text>
  <text x="580" y="260" class="sans dsc">Executable utilities staged</text>
  <text x="580" y="277" class="sans dsc">into `.harness/scripts/`.</text>

  <!-- Group 3: Delegation & Middleware (2 components) -->
  <rect x="820" y="20" width="240" height="300" rx="14" fill="#f8fafc" stroke="#fcd34d" stroke-width="1.8"/>
  <rect x="820" y="20" width="240" height="36" rx="12" fill="#fef7e0"/>
  <text x="940" y="43" text-anchor="middle" class="sans grp" fill="#b06000">Delegation &amp; Middleware</text>

  <!-- subagents.md -->
  <rect x="836" y="72" width="208" height="106" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="850" y="96" class="sans cmp">7. Subagents</text>
  <text x="850" y="114" class="fil" fill="#b45309">subagents.md</text>
  <text x="850" y="138" class="sans dsc">Work decomposition &amp;</text>
  <text x="850" y="155" class="sans dsc">pre-return Verifier role.</text>

  <!-- plugins.json -->
  <rect x="836" y="194" width="208" height="106" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="850" y="218" class="sans cmp">8. Middleware Plugins</text>
  <text x="850" y="236" class="fil" fill="#b45309">plugins.json</text>
  <text x="850" y="260" class="sans dsc">Deterministic pre/post-tool</text>
  <text x="850" y="277" class="sans dsc">guards &amp; reminders.</text>
</svg>
