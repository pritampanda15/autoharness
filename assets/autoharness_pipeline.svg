<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420" width="100%" role="img" aria-label="AutoHarness Pipeline: Code Self-Healing, Task-level Propose-Probe-Compose recursion, and Harnessing-level Lesson Ledger recursion">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
    .hdr  { font-size: 13px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; }
    .ttl  { font-size: 15px; font-weight: 700; fill: #0f172a; }
    .sub  { font-size: 12px; fill: #475569; }
    .tag  { font-size: 11px; font-weight: 600; }
  </style>
  <defs>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4285F4"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34A853"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="420" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- TOP BAND: Task & Code-Level Recursion -->
  <rect x="18" y="18" width="1044" height="256" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="5,4"/>
  <text x="34" y="42" class="sans hdr" fill="#1a73e8">Task &amp; Code-Level Recursion · Propose – Probe – Compose + Self-Healing</text>

  <!-- Step 1: Code & Suite Executor -->
  <rect x="34" y="62" width="190" height="190" rx="12" fill="#ffffff" stroke="#4285F4" stroke-width="2"/>
  <rect x="34" y="62" width="190" height="32" rx="10" fill="#e8f0fe"/>
  <text x="129" y="83" text-anchor="middle" class="sans tag" fill="#1967d2">1. EXECUTE &amp; GRADE</text>
  <text x="129" y="114" text-anchor="middle" class="sans ttl">Code + Agent Suite</text>
  <text x="129" y="136" text-anchor="middle" class="sans sub">• AST &amp; pytest scan</text>
  <text x="129" y="156" text-anchor="middle" class="sans sub">• Isolated code healer</text>
  <text x="129" y="176" text-anchor="middle" class="sans sub">• Deterministic + Trace</text>
  <text x="129" y="196" text-anchor="middle" class="sans sub">• Grounded Judge</text>
  <rect x="52" y="214" width="154" height="24" rx="6" fill="#f1f5f9"/>
  <text x="129" y="230" text-anchor="middle" class="sans tag" fill="#334155">Frozen Model Weights</text>

  <line x1="224" y1="157" x2="258" y2="157" stroke="#4285F4" stroke-width="2.2" marker-end="url(#arrBlue)"/>

  <!-- Step 2: Harness Editor (Propose) -->
  <rect x="262" y="62" width="204" height="190" rx="12" fill="#ffffff" stroke="#EA4335" stroke-width="2"/>
  <rect x="262" y="62" width="204" height="32" rx="10" fill="#fce8e6"/>
  <text x="364" y="83" text-anchor="middle" class="sans tag" fill="#c5221f">2. PROPOSE (K CANDIDATES)</text>
  <text x="364" y="114" text-anchor="middle" class="sans ttl">Harness² Editor</text>
  <rect x="278" y="128" width="172" height="28" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text x="364" y="146" text-anchor="middle" class="sans sub" fill="#991b1b">Invariant reasoning edits</text>
  <rect x="278" y="164" width="172" height="28" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text x="364" y="182" text-anchor="middle" class="sans sub" fill="#991b1b">Domain skills &amp; tool rules</text>
  <rect x="278" y="200" width="172" height="28" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text x="364" y="218" text-anchor="middle" class="sans sub" fill="#991b1b">Guardrails &amp; plugins</text>

  <line x1="466" y1="157" x2="500" y2="157" stroke="#4285F4" stroke-width="2.2" marker-end="url(#arrBlue)"/>

  <!-- Step 3: Isolated Parallel Probes -->
  <rect x="504" y="62" width="206" height="190" rx="12" fill="#ffffff" stroke="#FBBC04" stroke-width="2"/>
  <rect x="504" y="62" width="206" height="32" rx="10" fill="#fef7e0"/>
  <text x="607" y="83" text-anchor="middle" class="sans tag" fill="#b06000">3. PARALLEL PROBE</text>
  <text x="607" y="114" text-anchor="middle" class="sans ttl">Isolated Sandboxes</text>
  <text x="607" y="136" text-anchor="middle" class="sans sub">• Static anti-leak filter</text>
  <rect x="522" y="148" width="170" height="24" rx="5" fill="#fffbeb" stroke="#fde68a"/>
  <text x="607" y="164" text-anchor="middle" class="sans sub">Probe h₁  (workspace copy)</text>
  <rect x="522" y="178" width="170" height="24" rx="5" fill="#fffbeb" stroke="#fde68a"/>
  <text x="607" y="194" text-anchor="middle" class="sans sub">Probe h₂ … hₖ (parallel)</text>
  <text x="607" y="226" text-anchor="middle" class="sans sub" font-weight="600">Measured per-case contrasts</text>

  <line x1="710" y1="157" x2="744" y2="157" stroke="#4285F4" stroke-width="2.2" marker-end="url(#arrBlue)"/>

  <!-- Step 4: Contrastive Composer + Holdout Gate -->
  <rect x="748" y="62" width="296" height="190" rx="12" fill="#ffffff" stroke="#34A853" stroke-width="2"/>
  <rect x="748" y="62" width="296" height="32" rx="10" fill="#e6f4ea"/>
  <text x="896" y="83" text-anchor="middle" class="sans tag" fill="#137333">4. COMPOSE &amp; HOLDOUT GATE</text>
  <text x="896" y="114" text-anchor="middle" class="sans ttl">Behavioral Composer &amp; Gate</text>
  <text x="896" y="138" text-anchor="middle" class="sans sub">• Merges winning candidate contrasts</text>
  <text x="896" y="158" text-anchor="middle" class="sans sub">• Hidden holdout split must not drop</text>
  <text x="896" y="178" text-anchor="middle" class="sans sub">• Token bloat &amp; regression budget check</text>
  <rect x="772" y="196" width="248" height="36" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="896" y="219" text-anchor="middle" class="sans tag" fill="#15803d">✓ Promote Baseline or Byte-for-Byte Revert</text>

  <!-- BOTTOM BAND: Harnessing-Level Recursion -->
  <rect x="18" y="292" width="1044" height="110" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="34" y="316" class="sans hdr" fill="#b45309">Harnessing-Level Recursion · Cross-Session Experience &amp; Improvement Library</text>

  <rect x="360" y="328" width="320" height="58" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="520" y="352" text-anchor="middle" class="sans ttl">5. Experience Reflector</text>
  <text x="520" y="372" text-anchor="middle" class="sans sub">Distills accepted &amp; rejected probe evidence</text>

  <rect x="748" y="328" width="296" height="58" rx="10" fill="#ffffff" stroke="#34A853" stroke-width="1.5"/>
  <text x="896" y="352" text-anchor="middle" class="sans ttl">Persistent Lesson Ledger</text>
  <text x="896" y="372" text-anchor="middle" class="sans sub">DO / AVOID priors (`lessons.json` &amp; `memory.md`)</text>

  <!-- Connecting arrows between bands -->
  <path d="M 896 252 L 896 280 L 520 280 L 520 326" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrAmber)"/>
  <line x1="680" y1="357" x2="744" y2="357" stroke="#34A853" stroke-width="2" marker-end="url(#arrGreen)"/>
  <path d="M 360 357 L 129 357 L 129 256" fill="none" stroke="#34A853" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrGreen)"/>
  <text x="235" y="348" text-anchor="middle" class="sans tag" fill="#15803d">Guides next session &amp; task</text>
</svg>
