# autoharness config. Default profile: needs no API key — Claude Code (your login) is the agent under
# test, the judge, and the fixer. For Anthropic/Gemini/OpenAI APIs, see autoharness.api.yaml.

cases: [cases/golden, cases/mined]   # add cases/auto if healer.synthesize_cases is enabled
code_paths: []                       # e.g. [src, app] — source code watched & healed automatically on save/commit
runs_dir: runs
trials: 3
workers: 3

agent:
  type: command                      # command | claude | gemini | openai | scripted
  model: claude-opus-5-5
  # Point to a single prompt file OR an 8-component Harness² directory (e.g. harnesses/harness2)
  system_prompt_file: harnesses/claude-code/system.md
  timeout_s: 600
  # {claude} = agent.cli if set, else the desktop app's bundled Claude Code, else `claude` on PATH.
  # Stripped-down Claude Code: your system prompt, core tools only, no MCP/plugins/settings,
  # no saved session (eval runs stay out of the transcripts `autoharness mine` reads).
  command: >-
    {claude} -p {prompt} --output-format stream-json --verbose
    --model claude-opus-5-5 --effort medium
    --system-prompt-file {system_prompt_file}
    --tools Bash,Read,Write,Edit,Glob,Grep
    --permission-mode acceptEdits --allowedTools Bash,Read,Write,Edit,Glob,Grep
    --disallowedTools "Bash(rm -rf:*)" "Bash(sudo:*)" "Bash(git push:*)"
    --strict-mcp-config --setting-sources "" --no-session-persistence
    --max-budget-usd 2

judge:
  backend: claude-cli
  model: claude-opus-5-5
  effort: high
  samples: 3
  min_confidence: 0.7
  skip_if_deterministic_fails: true
  autonomous: false                  # set true to auto-certify unanimous evidence-grounded verdicts

calibration:
  labels_file: labels/calibration.jsonl
  min_agreement: 0.85
  min_labels: 20

fixer:
  backend: claude-cli                # claude-cli | api | gemini | openai
  model: claude-opus-5-5
  effort: high
  editable: [harnesses/claude-code/system.md]   # file(s) OR 8-component Harness² dir (e.g. harnesses/harness2)
  max_iters: 3
  candidates: 3                      # diverse candidate edits (invariant / skill / guardrail), probed in parallel
  parallel: 3
  compose: true                      # contrastive merge of winning edits across probed candidates
  reflect: true                      # distil every session into lessons/lessons.json & LESSONS.md
  lessons_file: lessons/lessons.json
  max_usd_per_trigger: 5
  max_token_increase_pct: 30

healer:
  enabled: true                      # auto-repair broken Python modules in code_paths inside isolated sandboxes
  max_attempts: 2
  sync_memory: true                  # refresh harnesses/<dir>/memory.md with live codebase map
  synthesize_cases: false

loop:
  watch: [harnesses/claude-code, cases/golden, cases/mined]
  interval_s: 3
  debounce_s: 5
  autofix: true
  notify: true

gate:
  max_pass_rate_drop: 0.05
  max_case_drop: 0.34
